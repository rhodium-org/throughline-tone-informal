[project]
name = "Tone — Informal register (throughline source)"
format_version = 3

# A throughline *source*: a standalone graph a consuming project composes via
# throughline-compose, importing it under a namespace (e.g. `tone`) and referencing
# principles as `tone:UR-0001` or rules as `tone:SR-0001`. The UIDs here are this
# source's own and immutable; the register + dimension reference lives in
# `attrs.source_ref`, never in the UID.
#
# This is the *tone / register* axis — how the writing SOUNDS relative to the reader
# relationship — for ONE register: INFORMAL. It deliberately says nothing about
# readability, spelling, punctuation, genre, medium or brand voice; each of those is
# its own throughline source. Register variants are MUTUALLY EXCLUSIVE: formal,
# neutral and informal are SIBLING sources and a consumer composes exactly one under
# the `tone` namespace (swapping register is a one-line `url`/`ref` change). Mixing
# registers in one graph would merge contradictory rules, so they are never combined.
#
# The rules are original house tone guidance, licensed under
# Apache-2.0; nothing here reproduces a third-party standard. Each principle is a
# `user_requirement`; each concrete rule is a `system_requirement` that `implements`
# its principle.

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ground_link_types = ["derives_from", "implements"]
ai_origins = ["ai", "hybrid"]

[types.user_requirement]
attrs.source_ref = { required = true }

[types.system_requirement]
attrs.source_ref = { required = true }

[links]
types = ["derives_from", "implements", "relates"]

[link_rules]
derives_from = { from = ["user_requirement"], to = ["intent"] }
implements   = { from = ["system_requirement"], to = ["user_requirement"] }

[status]
values = ["proposed", "draft", "deferred", "approved", "ratified", "implemented",
          "verified", "suspect", "rejected", "deleted"]

[transitions]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'proposed' no route to it, so an item resting in 'proposed' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# proposed suspect`.
proposed    = ["draft", "approved", "ratified", "deferred", "rejected", "deleted",
               "suspect"]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'draft' no route to it, so an item resting in 'draft' could never be marked
# suspect and invalidating anything it grounds in would have left it unflagged.
# Narrow it back deliberately with `tl schema transition deny draft suspect`.
draft       = ["approved", "deferred", "rejected", "deleted", "suspect"]
# `tl migrate` added the move to 'suspect' (SR-0188): this lifecycle gave
# 'deferred' no route to it, so an item resting in 'deferred' could never be
# marked suspect and invalidating anything it grounds in would have left it
# unflagged. Narrow it back deliberately with `tl schema transition deny
# deferred suspect`.
deferred    = ["draft", "approved", "rejected", "deleted", "suspect"]
approved    = ["ratified", "implemented", "deferred", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["approved", "ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]

# `tl docs` regenerates docs/spec.md + README.md from the graph; `tl docs --check`
# gates them so the published counts and tables can never drift.
[docs]
paths = ["docs/*.md", "README.md"]

# Semantic status roles (SR-0131): which declared status
# plays each role the tool's operations act on. Backfilled by
# `tl migrate`; edit to match your own status vocabulary.
[status.roles]
initial = "draft"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"
