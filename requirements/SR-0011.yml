uid: SR-0011
type: system_requirement
status: approved
title: "Close with a warm, casual sign-off"
text: "Where the medium closes with a sign-off, close warmly and casually, for example \"Cheers\", \"Thanks\" or \"Speak soon\", rather than a stiff \"Yours faithfully\". Whether a sign-off exists at all is a medium decision; this rule governs only its register."
